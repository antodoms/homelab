apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: openclaw
spec:
  # Pinned: :latest now refuses cron state written before 2026-07-01 and asks
  # to upgrade through 2026.9.7 first. Bump deliberately from here.
  # Temporarily on 2026.9.5: 2026.9.7's doctor refuses the retired Telegram
  # JSON state on the PVC until `openclaw doctor --fix` has run on 2026.9.5.
  # Bump back to 2026.9.7 once that's done.
  image:
    repository: ghcr.io/openclaw/openclaw
    tag: "2026.9.5"
  envFrom:
    - secretRef:
        name: openclaw-api-keys
  gateway:
    controlUiOrigins:
      - https://{{ .Values.httproute.hostnames | first }}
  config:
    mergeMode: overwrite
    raw:
      agents:
        defaults:
          model:
            primary: "openrouter/inclusionai/ling-2.6-1t:free"
  resources:
    requests:
      cpu: 1m
      memory: 1Mi
    limits:
      cpu: "4"
      memory: 4Gi

  storage:
    persistence:
      enabled: true
      size: 10Gi
  
  initContainers:
    # 2026.9.7's doctor refuses to start when the temp workspace's ancestor is
    # group/world writable without the sticky bit. The operator's /tmp emptyDir
    # is root-owned 2777 (fsGroup), so restore normal /tmp perms as root.
    - name: fix-tmp-perms
      image: busybox:1.37
      command: ["chmod", "1777", "/tmp"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
    - name: install-models
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          mkdir -p /data/agents/main/agent
          cp /models-config/models.json /data/agents/main/agent/models.json
      volumeMounts:
        - name: data
          mountPath: /data
        - name: models-config
          mountPath: /models-config
    - name: install-gogcli
      image: curlimages/curl:8.5.0
      command:
        - sh
        - -c
        - |
          curl -fsSL https://github.com/steipete/gogcli/releases/download/v0.12.0/gogcli_0.12.0_linux_amd64.tar.gz \
            -o /tmp/gogcli.tar.gz
          tar -xzf /tmp/gogcli.tar.gz -C /tmp
          cp /tmp/gog /extra-bin/gog
          chmod +x /extra-bin/gog
      volumeMounts:
        - name: extra-bin
          mountPath: /extra-bin

  extraVolumes:
    - name: models-config
      configMap:
        name: openclaw-models
    - name: extra-bin
      emptyDir: {}
    - name: gog-config
      emptyDir: {}
    - name: gog-credentials
      secret:
        secretName: openclaw-api-keys
        items:
          - key: GOG_CLIENT_CREDENTIALS_JSON
            path: gog_credentials.json
    - name: nfsshare
      nfs:
        server: {{ .Values.nfsshare.server }}
        path: {{ .Values.nfsshare.path }}
  extraVolumeMounts:
    - name: extra-bin
      mountPath: /usr/local/extra-bin
    - name: gog-config
      mountPath: /home/openclaw/.config/gog
    - name: gog-credentials
      mountPath: /usr/local/extra-bin/gog_credentials.json
      subPath: gog_credentials.json
      readOnly: true
    - name: nfsshare
      mountPath: /mnt/nas
