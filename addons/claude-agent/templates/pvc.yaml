# HOME for the agent: claude.ai login, workspace trust, installed CLIs and
# the cloned repo all survive pod restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-agent-home
  labels:
    app.kubernetes.io/name: claude-agent
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
