apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-agent
  labels:
    app.kubernetes.io/name: claude-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-agent-view
  labels:
    app.kubernetes.io/name: claude-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: claude-agent
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-agent-read
  labels:
    app.kubernetes.io/name: claude-agent
rules:
{{- range .Values.rbac.extraReadRules }}
  - apiGroups: {{ toJson .apiGroups }}
    resources: {{ toJson .resources }}
    verbs: [get, list, watch]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-agent-read
  labels:
    app.kubernetes.io/name: claude-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-agent-read
subjects:
  - kind: ServiceAccount
    name: claude-agent
    namespace: {{ .Release.Namespace }}
