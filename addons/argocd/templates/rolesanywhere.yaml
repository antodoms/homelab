# Client cert the repo-server presents to IAM Roles Anywhere for SOPS/KMS.
# The CA secret is written by proxmox-talos/argocd-sops-secrets.tf; the CN
# must match the role's trust policy in aws-account/argocd-sops-rolesanywhere.tf.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: argocd-rolesanywhere-ca
spec:
  ca:
    secretName: argocd-rolesanywhere-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-repo-server-rolesanywhere
spec:
  secretName: argocd-repo-server-rolesanywhere
  commonName: argocd-repo-server
  duration: 720h
  renewBefore: 240h
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
  usages:
    - digital signature
    - client auth
  issuerRef:
    name: argocd-rolesanywhere-ca
    kind: Issuer
