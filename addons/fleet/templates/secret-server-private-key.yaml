{{- if .Values.fleetSecrets.serverPrivateKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: fleet-server-private-key
  labels:
    app.kubernetes.io/name: fleet
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  private-key: {{ .Values.fleetSecrets.serverPrivateKey | quote }}
{{- end }}
