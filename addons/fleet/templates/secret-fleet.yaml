{{- if and .Values.fleetSecrets.wstepIdentityCert .Values.fleetSecrets.wstepIdentityKey -}}
# The upstream chart's catch-all secret (fleet.secretName, default "fleet"):
# holds the Windows MDM WSTEP identity pair the Deployment injects as
# FLEET_MDM_WINDOWS_WSTEP_IDENTITY_{CERT,KEY}_BYTES.
apiVersion: v1
kind: Secret
metadata:
  name: fleet
  labels:
    app.kubernetes.io/name: fleet
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  wstep-identity-cert.pem: |
{{ .Values.fleetSecrets.wstepIdentityCert | indent 4 }}
  wstep-identity-key.pem: |
{{ .Values.fleetSecrets.wstepIdentityKey | indent 4 }}
{{- end }}
