{{- /*
  Zoho OIDC client credentials for the dashboard/indexer openid auth domain.
  clientId/clientSecret are NOT in the public values.yaml — they arrive via
  the SOPS-encrypted config/secrets/homelab.enc.yaml valueFile on the
  Application (wazuh.dashboard.sso.oidc.clientId|clientSecret). When those
  values are absent (e.g. a local `helm template` without the secrets file)
  the Secret simply isn't rendered.
  The key names match the chart defaults for sso.oidc.clientIdKey/clientSecretKey.
*/}}
{{- $oidc := .Values.wazuh.dashboard.sso.oidc }}
{{- if and $oidc.clientId $oidc.clientSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $oidc.existingSecret }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  OPENSEARCH_OIDC_CLIENT_ID: {{ $oidc.clientId | quote }}
  OPENSEARCH_OIDC_CLIENT_SECRET: {{ $oidc.clientSecret | quote }}
{{- end }}
