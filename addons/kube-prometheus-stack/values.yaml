kube-prometheus-stack:
  # CRDs are managed by the dedicated prometheus-operator-crds Application
  # (chart/templates/prometheus-operator-crds.yaml) synced at wave -10,
  # so they are always updated before this chart is compared/synced.
  # The in-chart copy and its upgradeJob hook must stay off to keep a
  # single owner for CRDs (the upgradeJob also times out in-cluster).
  crds:
    enabled: false
    upgradeJob:
      enabled: false

  ## Create default rules for monitoring the cluster
  ## Disable rules for unreachable components
  ##
  defaultRules:
    create: true
    rules:
      etcd: false
      kubeScheduler: false
    disabled:
      KubeCPUOvercommit: true
      KubeMemoryOvercommit: true
      KubeletTooManyPods: true
      InfoInhibitor: true

  ## Disable component scraping for the kube controller manager, etcd, and kube-scheduler
  ## These components are not reachable on EKS
  ##
  kubeControllerManager:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false

  prometheus:
    prometheusSpec:
      ## Prometheus StorageSpec for persistent data on AWS EBS
      ## ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/user-guides/storage.md
      ##
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: mayastor-sc
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 30Gi

  alertmanager:
    config:
      route:
        receiver: keep
        group_by: [alertname, namespace, severity]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - matchers:
              - severity = "info"
            receiver: "null"
          - matchers:
              - alertname = "Watchdog"
            receiver: "null"
      receivers:
        - name: "null"
        - name: keep
          webhook_configs:
            - url: "http://keep-backend.keep:8080/alerts/event/prometheus"
              send_resolved: true
      inhibit_rules:
        - source_matchers: [severity = "critical"]
          target_matchers: [severity = "warning"]
          equal: [alertname, namespace]

  prometheusOperator:
    admissionWebhooks:
      failurePolicy: Ignore

  ## additional configuration options available here: https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  grafana:
    # client_secret is supplied via config/secrets/homelab.enc.yaml (SOPS-encrypted
    # at rest) — the chart's client-side check can't see that, so it flags it as a
    # plaintext leak. Disabling since the actual leak protection is SOPS, not this.
    assertNoLeakedSecrets: false
    serviceAccount:
      create: true
    createNamespace: true
    ingress:
      enabled: false
      # Migrated to Gateway API - see templates/grafana-httproute.yaml
    extraObjects:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: grafana
        namespace: "{{ .Release.Namespace }}"
      spec:
        parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: homelab-gateway
          namespace: envoy-gateway-system
          sectionName: https
        hostnames:
        - grafana.homelab.home
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /
          backendRefs:
          - group: ""
            kind: Service
            name: "{{ .Release.Name }}-grafana"
            port: 80
            weight: 1
    grafana.ini:
      server:
        root_url: ""
      auth:
        disable_login_form: true
      auth.generic_oauth:
        enabled: true
        name: Zoho
        allow_sign_up: true
        scopes: openid email profile
        auth_url: https://accounts.zoho.com/oauth/v2/auth
        token_url: https://accounts.zoho.com/oauth/v2/token
        api_url: https://accounts.zoho.com/oauth/v2/userinfo
        use_pkce: true
        email_attribute_path: email
        # client_id, client_secret, role_attribute_path injected via secrets.yaml

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
