# Holmes is only reachable from the claude-agent namespace, and llama.cpp only
# from Holmes. Like the claude-agent policy, these are only enforced once a
# policy-aware CNI (e.g. Cilium) is enabled; flannel ignores them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: holmes
spec:
  podSelector:
    matchLabels:
      app: holmes
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: claude-agent
      ports:
        - protocol: TCP
          port: 5050
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llama-cpp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: llama-cpp
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: holmes
      ports:
        - protocol: TCP
          port: 8080
