apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-cpp-models
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.llamaCpp.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  labels:
    app.kubernetes.io/name: llama-cpp
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO model cache
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-cpp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-cpp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-server
          image: {{ .Values.llamaCpp.image }}
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - -hf
            - {{ .Values.llamaCpp.hfRepo }}
            - --alias
            - {{ .Values.llamaCpp.alias }}
            - --ctx-size
            - {{ .Values.llamaCpp.ctxSize | quote }}
            - --threads
            - {{ .Values.llamaCpp.threads | quote }}
            - --parallel
            - "1"
            # OpenAI-style tool calling via the model's chat template.
            - --jinja
          env:
            - name: LLAMA_CACHE
              value: /models
            - name: HOME
              value: /models
          ports:
            - name: http
              containerPort: 8080
          # /health is 503 until the model is downloaded and loaded.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.llamaCpp.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp
  labels:
    app.kubernetes.io/name: llama-cpp
spec:
  selector:
    app.kubernetes.io/name: llama-cpp
  ports:
    - name: http
      port: 8080
      targetPort: http
