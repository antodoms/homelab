{{- if and (.Values.argoCd) (.Values.argoCd.enable) -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-cd
  namespace: {{ .Values.argoNamespace | default "argocd" }}
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argoProject | default "default" }}
  source:
    repoURL: {{ .Values.repoUrl }}
    path: addons/argocd
    targetRevision: {{ .Values.targetRevision }}
    helm:
      valueFiles:
        # Multi-source $ref is incompatible with helm-secrets decryption —
        # ArgoCD never resolves $ref inside a URL scheme, so secrets:// + $ref
        # either gets rejected outright or (worse) silently skips decryption
        # and leaks raw SOPS ciphertext into the rendered manifest.
        # ref: https://github.com/jkroepke/helm-secrets/blob/main/docs/ArgoCD%20Integration.md
        # Plain relative path + single source avoids the $ref conflict entirely.
        - secrets://../../config/secrets/homelab.enc.yaml
      values: |
        argo-cd:
        {{- toYaml .Values.argoCd | nindent 10 }}
      parameters:
      - name: argo-cd.global.domain
        value: argocd.{{ .Values.ingressDomain }}
      - name: argo-cd.server.certificate.domain
        value: argocd.{{ .Values.ingressDomain }}
      - name: argo-cd.server.ingress.hostname
        value: argocd.{{ .Values.ingressDomain }}
      - name: argo-cd.server.config.url
        value: "https://argocd.{{ .Values.ingressDomain }}"
      - name: argo-cd.server.certificate.domain
        value: "argocd.{{ .Values.ingressDomain }}"
      - name: argo-cd.configs.cm.url
        value: "https://argocd.{{ .Values.ingressDomain }}"
  destination:
    server: {{ .Values.destinationServer | default "https://kubernetes.default.svc" }}
    namespace: argocd
  ignoreDifferences:
    - group: "*"
      kind: "*"
      # managedFieldsManagers must NOT include argocd-controller: combined
      # with RespectIgnoreDifferences, that makes ArgoCD ignore and re-graft
      # the live value of every field it itself manages — so a bad apply
      # (e.g. the SOPS-ciphertext leak into argocd-rbac-cm) can never be
      # corrected by any later sync. It was a workaround for the duplicate
      # bootstrap ArgoCD install fighting this one; that controller is now
      # scaled down.
      jsonPointers:
        # /metadata/managedFields must NOT be listed here: with
        # RespectIgnoreDifferences + ServerSideApply, ArgoCD grafts the live
        # value of each ignored pointer into the apply payload, and the API
        # server rejects any request with metadata.managedFields set
        # ("metadata.managedFields must be nil"), failing every resource.
        - /metadata/annotations
        - /metadata/labels
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
      - CreateNamespace={{ .Values.argoCd.createNamespace }}
      - ServerSideApply=true
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
{{- end -}}